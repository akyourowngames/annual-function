name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: >-
          node --test
          scripts/markdown-test.mjs
          scripts/channels-test.mjs
          scripts/escalation-test.mjs
          scripts/photo-test.mjs
          scripts/roles-test.mjs
          scripts/knowledge-test.mjs
          scripts/whatsapp-test.mjs
          scripts/telegram-test.mjs
          scripts/whatsapp-handler-test.mjs
          scripts/identity-test.mjs

  agent:
    name: Backstage assistant (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install fastapi httpx python-dotenv pydantic pytest
      - name: Unit tests
        run: pytest tests -q

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ADMIN_ACCESS_KEY: ci-placeholder-not-used
        run: npm run build

  smoke:
    name: Live smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke test the deployed app
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "SMOKE_URL secret is not set; skipping the live smoke test."
            exit 0
          fi
          node scripts/smoke.mjs
